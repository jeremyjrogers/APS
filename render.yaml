databases:
  - name: aps-db
    databaseName: aps
    user: aps
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: aps-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # `alembic upgrade head` runs on every start (including free-tier
    # cold-start wakeups) rather than as a separate pre-deploy step — it's a
    # no-op once the schema is current, and this avoids depending on a
    # pre-deploy-command feature that may be paid-plan-only.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aps-db
          property: connectionString
      # Render's `fromService` only exposes private-network addressing
      # (unreachable from a browser), so this has to be the real public URL.
      # "aps-frontend" collided with an existing, unrelated Render service on
      # first deploy, so this is the actual auto-suffixed hostname Render
      # assigned — not the predictable https://aps-frontend.onrender.com.
      # Check the dashboard if this ever needs to change.
      - key: CORS_ORIGINS
        value: https://aps-frontend-xek6.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: aps-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # "aps-backend" also collided on first deploy — this is the real
      # auto-suffixed hostname Render assigned. Baked in at build time
      # (Vite), so changing this needs a rebuild, not just a restart.
      - key: VITE_API_BASE
        value: https://aps-backend-q9br.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
